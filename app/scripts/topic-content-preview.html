<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Puma政策筆記｜主題內容</title>
<style>
:root{color-scheme:light;--paper:#fffaf1;--ink:#49362b;--orange:#be572f;--line:#e6cfb7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header,main,footer{max-width:1060px;margin:auto;padding:28px 24px}header{padding-top:45px}h1{font-size:clamp(27px,5vw,42px);line-height:1.35;margin:10px 0}h2{font-size:23px;line-height:1.5}h3{font-size:17px;color:var(--orange)}p{margin:12px 0}.eyebrow{color:var(--orange);font-weight:700}.note,.empty{color:#796450;font-size:14px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}input,select,textarea,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px}input{flex:1;min-width:200px}button{cursor:pointer;background:#be572f;color:white;border-color:#be572f}button:disabled{opacity:.55;cursor:default}select{max-width:100%}article{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:25px;padding:26px;box-shadow:3px 5px 0 #f0e2d1}.tag{font-size:13px;color:#89634c}.columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}.paragraph a{font-size:13px}a{color:#a34824;overflow-wrap:anywhere}.share{border-top:1px dashed var(--line);padding-top:15px;margin-top:20px}.share textarea{width:100%;resize:vertical;min-height:230px;line-height:1.8;background:#fffaf3}.sharebar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:10px}.count{font-size:14px;color:#795f4c}.sources{font-size:14px;margin-top:18px}.sources ul{padding-left:20px}details{font-size:14px;background:#fff8ed;padding:12px 16px;border-radius:8px;margin-top:18px}summary{cursor:pointer}footer{font-size:14px;border-top:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:650px){.columns{grid-template-columns:1fr;gap:0}article{padding:20px}header,main,footer{padding-left:16px;padding-right:16px}.share textarea{min-height:300px}}
</style>
<header><div class="eyebrow">Puma政策筆記 · 主題內容</div><h1>15類議題、86個主題</h1><p>每一題都整理出做法、訪談補充與可複製的短摘要，原文出處一起帶走。</p><p class="note">民間獨立整理，非官方發言。資料快照：2026／11／7；訪談稿尚未逐句對照影音。本頁為本機校讀預覽；公開視覺主題頁已另行發布。</p><div class="filters"><input id="query" type="search" placeholder="找主題，例如：都更房源、肌力、托育" aria-label="搜尋主題"><select id="group" aria-label="選擇類別"><option value="">全部類別</option></select></div><div id="results" class="note" aria-live="polite"></div></header>
<main id="topics"></main>
<footer>資料來源網站：<a href="https://puma.taipei/policies" target="_blank" rel="noopener noreferrer">沈伯洋官方政策</a>、<a href="https://puma-hub.pages.dev/#all" target="_blank" rel="noopener noreferrer">PUMA HUB 訪談／活動整理</a>。每題下方列出實際引用原文；來源文字不同時另列說明。</footer>
<script id="data" type="application/json">__TOPIC_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent);
const root=document.getElementById('topics');
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function link(url,text){const a=el('a',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function addParagraphs(parent,items,empty,sources){if(!items.length){parent.append(el('p',empty,'empty'));return}for(const item of items){const div=el('div',undefined,'paragraph');div.append(el('p',item.text));item.source_urls.forEach((url,i)=>{if(i)div.append(document.createTextNode(' · '));const source=sources.find(s=>s.url===url);div.append(link(url,source?.title||'原文'))});parent.append(div)}}
const cards=[];
for(const t of data.topics){const card=el('article');card.id=t.id;card.append(el('div',`${t.group_title} · ${t.id}${t.scope==='public_issue'?' · 公共議題觀點':''}`,'tag'),el('h2',t.title),el('p',t.intro));const columns=el('div',undefined,'columns');for(const [key,title,empty] of [['official','官方做法','本題目前對應的內容來自訪談／活動資料。'],['interview','訪談／活動補充','本題目前對應的內容來自官方政策頁。']]){const section=el('section');section.append(el('h3',title));addParagraphs(section,t[key],empty,t.sources);columns.append(section)}card.append(columns);
if(t.differences.length){const detail=el('details');detail.append(el('summary','來源文字差異'));addParagraphs(detail,t.differences,'',t.sources);card.append(detail)}
const share=el('section',undefined,'share');share.append(el('h3','分享貼文'));const textarea=el('textarea');textarea.value=t.share.text;textarea.setAttribute('aria-label',t.title+'的分享貼文');const bar=el('div',undefined,'sharebar');const button=el('button','複製貼文與來源');const count=el('span',`${textarea.value.length}／500 字元（含來源）`,'count');textarea.addEventListener('input',()=>{count.textContent=`${textarea.value.length}／500 字元（含來源）`;const found=textarea.value.match(/https:\/\/[^\s]+/g)||[];const valid=textarea.value.length<=500&&found.length===t.share.source_urls.length&&t.share.source_urls.every(u=>found.includes(decodeURI(u)));button.disabled=!valid;if(!valid)count.textContent+=' · 請保留來源並控制字數'});button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(textarea.value)}catch{textarea.focus();textarea.select();if(!document.execCommand('copy')){button.textContent='請選取文字後複製';return}}button.textContent='複製好了，連出處一起帶走。';setTimeout(()=>button.textContent='複製貼文與來源',2200)});bar.append(button,count);share.append(textarea,bar);card.append(share);
const sourceBlock=el('div',undefined,'sources');sourceBlock.append(el('strong','資料來源'));const ul=el('ul');for(const s of t.sources){const li=el('li');li.append(document.createTextNode(s.type==='official'?'官方政策｜':'訪談／活動｜'),link(s.url,s.title));ul.append(li)}sourceBlock.append(ul);card.append(sourceBlock);root.append(card);cards.push({card,t,text:[t.title,t.question,t.intro,...t.keywords,...t.official.map(p=>p.text),...t.interview.map(p=>p.text)].join(' ').toLowerCase()})}
for(const g of data.groups){const option=el('option',g.title);option.value=g.id;document.getElementById('group').append(option)}
function filter(){const q=document.getElementById('query').value.trim().toLowerCase();const group=document.getElementById('group').value;let n=0;for(const item of cards){const show=(!q||item.text.includes(q))&&(!group||item.t.group_id===group);item.card.hidden=!show;if(show)n++}document.getElementById('results').textContent=`顯示 ${n}／${data.topics.length} 題 · 所有預寫分享稿均含原文連結`}
document.getElementById('query').addEventListener('input',filter);document.getElementById('group').addEventListener('change',filter);filter();
</script></html>
